<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Library</title>
</head>

<body>
    <h1 class="container">Library</h1>
    <form class="container">
        <div class="mb-3">
            <label for="title" class="form-label">Book Title</label>
            <input type="text" class="form-control" id="title">
        </div>
        <div class="mb-3">
            <label for="author" class="form-label">Book Author</label>
            <input type="text" class="form-control" id="author">
        </div>
        <div class="mb-3">
            <label for="pages" class="form-label">Number of pages</label>
            <input type="text" class="form-control" id="pages">
        </div>
        <div class="mb-3">
            <label for="read" class="form-label">Have you already read?</label>
            <select class="form-select form-select" aria-label=".form-select-sm example" id="read">
                <option selected>Open this select menu</option>
                <option value="1">Yes</option>
                <option value="2">No</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <button type="reset" class="btn btn-primary">Clean</button>
    </form>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
